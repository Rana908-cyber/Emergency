<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams | Emergency</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background: #f4f6f9; display: flex; min-height: 100vh; }

    .sidebar { width: 220px; background: #1e293b; color: #fff; padding: 20px; }
    .sidebar h2 { margin-bottom: 24px; font-size: 20px; }
    .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 10px; border-radius: 6px; margin-bottom: 6px; }
    .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }

    .main { flex: 1; padding: 30px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top h1 { font-size: 24px; color: #1e293b; }

    .btn { border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; color: #fff; font-size: 14px; }
    .btn-add { background: #16a34a; }
    .btn-edit { background: #2563eb; }
    .btn-delete { background: #dc2626; }
    .btn-cancel { background: #64748b; }

    table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #e2e8f0; color: #1e293b; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; padding: 24px; border-radius: 10px; width: 360px; }
    .modal-box h3 { margin-bottom: 14px; }
    .modal-box label { display: block; margin: 10px 0 4px; font-size: 14px; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .modal-actions { margin-top: 18px; display: flex; gap: 8px; }
</style>
</head>
<body>

<aside class="sidebar">
    <h2>Emergency</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="teams.html" class="active">Teams</a>
    <a href="emergencies.html">Emergencies</a>
</aside>

<main class="main">
    <div class="top">
    <h1>Teams Management</h1>
    <button class="btn btn-add" onclick="openModal()">+ Add Team</button>
    </div>

    <table>
    <thead>
        <tr>
        <th>#</th>
            <th>Team Name</th>
        <th>Type</th>
        <th>Members</th>
        <th>Actions</th>
        </tr>
    </thead>
    <tbody id="teamsBody"></tbody>
    </table>
</main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Add Team</h3>
      <label>Team Name</label>
      <input type="text" id="teamName">
      <label>Type</label>
      <select id="teamType">
        <option>Ambulance</option>
        <option>Fire Department</option>
        <option>Police</option>
      </select>
      <label>Number of Members</label>
      <input type="number" id="teamMembers" min="1">
      <div class="modal-actions">
        <button class="btn btn-add" onclick="saveTeam()">Save</button>
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let teams = [
      { name: "Ambulance Team 1", type: "Ambulance", members: 5 },
      { name: "Fire Team 1", type: "Fire Department", members: 8 }
    ];
    let editIndex = null;

    function render() {
      const body = document.getElementById("teamsBody");
      body.innerHTML = "";
      teams.forEach((t, i) => {
        body.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${t.name}</td>
            <td>${t.type}</td>
            <td>${t.members}</td>
            <td>
              <button class="btn btn-edit" onclick="openModal(${i})">Edit</button>
              <button class="btn btn-delete" onclick="deleteTeam(${i})">Delete</button>
            </td>
          </tr>`;
      });
    }

    function openModal(i = null) {
      editIndex = i;
      document.getElementById("modalTitle").textContent = i === null ? "Add Team" : "Edit Team";
      document.getElementById("teamName").value = i === null ? "" : teams[i].name;
      document.getElementById("teamType").value = i === null ? "Ambulance" : teams[i].type;
      document.getElementById("teamMembers").value = i === null ? "" : teams[i].members;
      document.getElementById("modal").classList.add("show");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
    }

    function saveTeam() {
      const name = document.getElementById("teamName").value.trim();
      const type = document.getElementById("teamType").value;
      const members = document.getElementById("teamMembers").value;
      if (!name || !members) { alert("Please fill in all fields"); return; }

      const team = { name, type, members };
      if (editIndex === null) teams.push(team);
      else teams[editIndex] = team;

      closeModal();
      render();
    }

    function deleteTeam(i) {
      if (confirm("Are you sure you want to delete this team?")) {
        teams.splice(i, 1);
        render();
      }
    }

    render();
  </script>
</body>
</html>
